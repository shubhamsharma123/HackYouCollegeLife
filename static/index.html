<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hack Your College Life · Campus AI</title>
<style>
:root{--navy:#14213d;--maroon:#8c1c2b;--gold:#f2b705;--paper:#fffdf5;--cream:#f5efe0;--line:#cfe0f3;--ink:#222;--green:#1f8a4c;--red:#c0392b}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;color:var(--ink);background:var(--cream);
 background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(20,33,61,.07) 31px 32px)}
.hand{font-family:'Segoe Print','Bradley Hand','Comic Sans MS',cursive}
header{background:var(--navy);color:#fff;border-bottom:6px solid var(--gold);padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.crest{overflow:hidden;width:54px;height:54px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-size:28px;border:3px solid #fff}
.crest img{width:100%;height:100%;object-fit:cover}
header h1{margin:0;font-family:Georgia,serif;font-size:1.7rem;letter-spacing:1px;text-transform:uppercase}
header small{color:var(--gold);letter-spacing:3px;font-size:.7rem}
.pennant{margin-left:auto;background:var(--maroon);padding:6px 22px 6px 14px;clip-path:polygon(0 0,100% 50%,0 100%);font-weight:bold;font-size:.8rem;color:var(--gold)}
.wrap{display:flex;max-width:1250px;margin:22px auto;gap:22px;padding:0 16px}
nav{width:230px;flex:none;display:flex;flex-direction:column;gap:10px}
nav button{text-align:left;border:2px solid var(--navy);background:#fff;border-radius:6px 22px 22px 6px;padding:12px 14px;font-size:.95rem;font-weight:600;cursor:pointer;
 box-shadow:4px 4px 0 var(--navy);transition:.15s;color:var(--navy);border-left:10px solid var(--c)}
nav button small{display:block;font-weight:400;opacity:.65;font-size:.72rem}
nav button:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--navy)}
nav button.on{background:var(--navy);color:#fff}
nav .dean{background:var(--gold)}nav .dean.on{background:var(--navy)}
main{flex:1;min-width:0}
.sheet{background:var(--paper);border:2px solid var(--navy);border-radius:6px;padding:26px 26px 26px 70px;position:relative;box-shadow:8px 8px 0 rgba(20,33,61,.9);
 background-image:repeating-linear-gradient(0deg,transparent 0 29px,var(--line) 29px 30px)}
.sheet:before{content:"";position:absolute;left:52px;top:0;bottom:0;width:2px;background:#e66}
.sheet:after{content:"";position:absolute;left:14px;top:30px;bottom:30px;width:14px;background:radial-gradient(circle,var(--cream) 6px,transparent 7px) 0 0/14px 60px repeat-y}
.sheet h2{font-family:Georgia,serif;margin:0 0 2px;color:var(--navy);font-size:1.6rem}
.sub{margin:0 0 16px;color:#555}
label{font-weight:700;font-size:.82rem;color:var(--maroon);text-transform:uppercase;letter-spacing:1px}
input,textarea{width:100%;padding:10px 12px;margin:5px 0 12px;border:2px solid var(--navy);border-radius:6px;font:inherit;background:#fff}
input:focus,textarea:focus{outline:3px solid var(--gold)}
.row{display:flex;gap:12px}.row>div{flex:1}
.go{background:var(--maroon);color:#fff;border:2px solid var(--navy);border-radius:6px;padding:11px 22px;font-weight:700;font-size:1rem;cursor:pointer;box-shadow:3px 3px 0 var(--navy);text-transform:uppercase;letter-spacing:1px}
.go:hover{background:var(--navy);color:var(--gold)}.go:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--navy)}.go:disabled{opacity:.6;cursor:wait}
.out{margin-top:20px}
.md h3,.md h4,.md h5{color:var(--maroon);margin:12px 0 4px;font-family:Georgia,serif}.md p{margin:6px 0}.md ul{margin:6px 0;padding-left:22px}
.pills{display:flex;gap:8px;margin:6px 0 14px;flex-wrap:wrap}
.pill{border:2px solid var(--navy);background:#fff;border-radius:20px;padding:5px 16px;font-weight:600;cursor:pointer}.pill.on{background:var(--gold)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.fc{perspective:900px;height:170px;cursor:pointer}
.fc>div{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip>div{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border:2px solid var(--navy);border-radius:6px;padding:34px 14px 10px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600;overflow:auto;
 background:#fff linear-gradient(#e66 0 2px,transparent 2px) 0 24px/100% 100% no-repeat;box-shadow:3px 3px 0 var(--navy)}
.face:before{content:attr(data-t);position:absolute;top:4px;left:10px;font-size:.65rem;letter-spacing:2px;color:var(--maroon)}
.face.back{transform:rotateY(180deg);background-color:#fff7cc}
.q{background:#fff;border:2px solid var(--navy);border-radius:6px;padding:14px;margin-bottom:14px;box-shadow:3px 3px 0 var(--navy)}
.q b{display:block;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;margin:5px 0;padding:8px 12px;border:2px solid #bbb;border-radius:6px;background:var(--paper);cursor:pointer;font:inherit}
.opt:hover{border-color:var(--navy)}.opt.right{background:#d8f3e2;border-color:var(--green)}.opt.wrong{background:#fbdcd8;border-color:var(--red)}
.why{font-size:.88rem;color:#444;margin-top:6px}
.score{position:sticky;top:6px;z-index:2;display:inline-block;background:var(--navy);color:var(--gold);border-radius:20px;padding:4px 16px;font-weight:700;margin-bottom:10px}
.steps div{padding:3px 0;color:var(--green);font-weight:600}.steps div:before{content:"✔ "}
.err{background:#fbdcd8;border:2px solid var(--red);border-radius:6px;padding:12px}
.box{background:#fff;border:2px solid var(--navy);border-radius:6px;padding:14px 16px;margin:10px 0;box-shadow:3px 3px 0 var(--navy)}
.dl{display:inline-block;margin-top:10px;color:var(--maroon);font-weight:700}
.sticky{background:#fff176;padding:16px 18px;transform:rotate(-1.2deg);box-shadow:4px 6px 12px rgba(0,0,0,.25);max-width:520px;margin:18px 0;position:relative}
.sticky:before{content:"";position:absolute;top:-10px;left:42%;width:80px;height:20px;background:rgba(200,200,200,.6);transform:rotate(3deg)}
.chip{display:inline-block;background:var(--navy);color:var(--gold);padding:3px 12px;border-radius:14px;margin:2px;font-size:.8rem;font-weight:700}
.sec{border-top:3px dashed var(--navy);margin-top:22px;padding-top:12px}.sec>h3{margin:0 0 8px;font-family:Georgia,serif;color:var(--navy)}
.thumb{width:200px;border:2px solid var(--navy);border-radius:6px;float:right;margin:0 0 10px 14px}
.spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
footer{text-align:center;padding:18px;color:#666;font-size:.8rem}
@media(max-width:800px){.wrap{flex-direction:column}nav{width:auto;flex-direction:row;overflow-x:auto;padding-bottom:8px}nav button{white-space:nowrap}nav button small{display:none}.sheet{padding:20px 14px 20px 34px}.sheet:before{left:22px}.sheet:after{display:none}.row{flex-direction:column;gap:0}.pennant{display:none}}
</style></head><body>
<header><div class="crest"><img src="/static/me.png" alt="logo" onerror="this.replaceWith('🎓')"></div><div><h1>Hack Your College Life</h1><small>CAMPUS AI · EST. 2026</small></div><div class="pennant">5 AI AGENTS ON CAMPUS</div></header>
<div class="wrap">
<nav id="nav"></nav>
<main><div class="sheet" id="sheet"></div></main></div>
<footer class="hand">Made with ☕ + 🤖 for the 1st-year batch · Python + FastAPI</footer>
<script>
const $=s=>document.querySelector(s), esc=t=>(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
function md(t){let h='',ul=false;const cl=()=>{if(ul){h+='</ul>';ul=false}};
 for(let l of esc(t).split('\n')){l=l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');let m;
  if(m=l.match(/^(#{1,3}) (.*)/)){cl();const n=m[1].length+2;h+=`<h${n}>${m[2]}</h${n}>`}
  else if(m=l.match(/^\s*[-*•] (.*)/)){if(!ul){h+='<ul>';ul=true}h+=`<li>${m[1]}</li>`}
  else if(!l.trim())cl();else{cl();h+=`<p>${l}</p>`}}cl();return `<div class="md">${h}</div>`}
async function api(u,b){const r=await fetch('/api/'+u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});return r.json()}
const err=d=>`<div class="err">⚠️ ${esc(d.error)}</div>`;

/* ---------- renderers (each agent's output) ---------- */
const R={
 study(d){if(d.error)return err(d);let sc=0,ans=0;const id='s'+Math.random().toString(36).slice(2,7);
  setTimeout(()=>{const root=document.getElementById(id);
   root.querySelectorAll('.pill').forEach(p=>p.onclick=()=>{root.querySelectorAll('.pill').forEach(x=>x.classList.remove('on'));p.classList.add('on');root.querySelectorAll('.tab').forEach(t=>t.style.display=t.dataset.k==p.dataset.k?'block':'none')});
   root.querySelectorAll('.fc').forEach(f=>f.onclick=()=>f.classList.toggle('flip'));
   root.querySelectorAll('.q').forEach(q=>{const a=+q.dataset.a;q.querySelectorAll('.opt').forEach((o,i)=>o.onclick=()=>{if(q.dataset.done)return;q.dataset.done=1;ans++;
    q.querySelectorAll('.opt')[a].classList.add('right');if(i==a)sc++;else o.classList.add('wrong');q.querySelector('.why').style.display='block';root.querySelector('.score').textContent=`🏆 Score: ${sc}/${ans} (of ${d.quiz.length})`})})},0);
  return `<div id="${id}"><div class="pills"><span class="pill on" data-k="n">📝 Notes</span><span class="pill" data-k="f">🃏 Flashcards (${d.flashcards.length})</span><span class="pill" data-k="q">❓ Quiz (${d.quiz.length})</span></div>
  <div class="tab" data-k="n">${md(d.summary)}</div>
  <div class="tab" data-k="f" style="display:none"><p class="hand">Tap a card to flip 👆</p><div class="cards">${d.flashcards.map(f=>`<div class="fc"><div><div class="face" data-t="QUESTION">${esc(f.q)}</div><div class="face back" data-t="ANSWER">${esc(f.a)}</div></div></div>`).join('')}</div></div>
  <div class="tab" data-k="q" style="display:none"><div class="score">🏆 Score: 0/0 (of ${d.quiz.length})</div>${d.quiz.map((q,n)=>`<div class="q" data-a="${q.answer}"><b>Q${n+1}. ${esc(q.q)}</b>${q.options.map(o=>`<button class="opt">${esc(o)}</button>`).join('')}<div class="why" style="display:none">💡 ${esc(q.why)}</div></div>`).join('')}</div></div>`},
 youtube(d){if(d.error)return err(d);return `${d.video_id?`<img class="thumb" src="https://img.youtube.com/vi/${d.video_id}/mqdefault.jpg" onerror="this.remove()">`:''}<h3 class="hand">${esc(d.title||'Video summary')}</h3>${md(d.summary)}<div style="clear:both"></div>`},
 research(d){if(d.error)return err(d);return `<div class="steps">${d.steps.map(s=>`<div>${esc(s)}</div>`).join('')}</div><div class="box">${md(d.result)}</div><a class="dl" href="/reports/${d.file}">⬇ Download report (.md)</a>`},
 assignment(d){if(d.error)return err(d);return d.answers.map((a,i)=>`<div class="box"><b style="color:var(--maroon)">Q${i+1}. ${esc(a.q)}</b>${md(a.a)}</div>`).join('')+`<a class="dl" href="/reports/${d.file}">⬇ Download full assignment (.md)</a>`},
 orchestrator(d){return `<div>${d.plan.map(s=>`<span class="chip">${s.agent}</span>`).join(' ➜ ')}</div>
  <div class="steps" style="margin-top:8px">${d.log.map(s=>`<div>${esc(s)}</div>`).join('')}</div>
  ${d.outputs.map(o=>`<div class="sec"><h3>${A.find(a=>a.id==o.agent)?.ico||''} ${A.find(a=>a.id==o.agent)?.name||o.agent}</h3>${R[o.agent](o.data)}</div>`).join('')}
  <div class="sticky hand"><b>📌 Dean's note</b><br>${esc(d.note).replace(/\n/g,'<br>')}</div>`}
};

/* ---------- agent definitions ---------- */
const A=[
 {id:'study',ico:'📚',name:'Study Buddy',tag:'Notes · Flashcards · Quiz',c:'#2a6df4',sub:'Topic do — notes, flashcards aur quiz ready.',
  f:'<label>Topic</label><input id="topic" placeholder="e.g. Recursion, Ohm\'s Law, Supply & Demand">',
  run:()=>api('study',{topic:$('#topic').value})},
 {id:'youtube',ico:'🎬',name:'Lecture Summarizer',tag:'YouTube → Summary',c:'#e62117',sub:'YouTube lecture ka link do, 1 minute me summary.',
  f:'<label>YouTube URL</label><input id="url" placeholder="https://www.youtube.com/watch?v=..."><label>Captions nahi mile? Transcript paste karo (optional)</label><textarea id="tr" rows="3"></textarea>',
  run:()=>api('youtube',{url:$('#url').value,transcript:$('#tr').value})},
 {id:'research',ico:'🔬',name:'Research Assistant',tag:'Topic + Word count',c:'#12a150',sub:'Topic aur word count do — agent web se research karke summary dega.',
  f:'<div class="row"><div><label>Topic</label><input id="rt" placeholder="e.g. Quantum Computing"></div><div style="max-width:160px"><label>Words</label><input id="rw" type="number" value="300" min="50" max="1500"></div></div>',
  run:()=>api('research',{topic:$('#rt').value,words:+$('#rw').value})},
 {id:'assignment',ico:'✍️',name:'Assignment Writer',tag:'Questions → Answers',c:'#9b59b6',sub:'Topic aur questions do (1 line = 1 question) — saare answers fill.',
  f:'<label>Subject / Topic</label><input id="at" placeholder="e.g. Operating Systems"><label>Questions (one per line)</label><textarea id="aq" rows="5" placeholder="What is a process?\nExplain deadlock.\nDifference between thread and process?"></textarea>',
  run:()=>api('assignment',{topic:$('#at').value,questions:$('#aq').value.split('\n')})},
 {id:'orchestrator',ico:'🏛️',name:"Dean's Office",tag:'Orchestrator · supervises all',c:'#f2b705',cls:'dean',sub:'Bas apna kaam likho — Dean sahi agents ko bulayega, monitor karega aur final note dega.',
  f:'<label>Tell the Dean what you need</label><textarea id="ot" rows="5" placeholder="Make assignment on DBMS:\n1. What is a primary key?\n2. What is normalization?\nAlso summarize https://youtu.be/xxxx and give me flashcards to study"></textarea>',
  run:()=>api('orchestrate',{task:$('#ot').value})}
];
function openAgent(id){const a=A.find(x=>x.id==id);
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.id==id));
 $('#sheet').innerHTML=`<h2>${a.ico} ${a.name}</h2><p class="sub hand">${a.sub}</p>${a.f}<button class="go" id="go">Run Agent 🚀</button><div class="out" id="out"></div>`;
 $('#go').onclick=async()=>{const b=$('#go');b.disabled=true;$('#out').innerHTML='<p class="hand"><span class="spin">⚙️</span> Agent kaam kar raha hai...</p>';
  try{const d=await a.run();$('#out').innerHTML=R[a.id](d)}catch(e){$('#out').innerHTML=err({error:'Server se connect nahi hua: '+e})}b.disabled=false}}
$('#nav').innerHTML=A.map(a=>`<button class="${a.cls||''}" data-id="${a.id}" style="--c:${a.c}">${a.ico} ${a.name}<small>${a.tag}</small></button>`).join('');
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>openAgent(b.dataset.id));openAgent("study");
</script></body></html>
